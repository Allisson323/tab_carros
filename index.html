
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styless.css">
    <title>Clássicos Brasileiros</title>
</head>
<body>
    <main class="container">
        <h1>BR Clássicos Brasileiros</h1>
        <p class="sub">Os carros que marcaram as ruas do Brasil</p>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Modelo</th>
                        <th>Marca</th>
                        <th>Lançamento</th>
                        <th>Categoria</th>
                        <th>Motor</th>
                        <th>Valor médio (aprox.)</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                </tbody>
            </table>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
